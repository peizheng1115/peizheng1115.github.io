<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Ring / Membrane Gradient -->
    <linearGradient id="membraneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Flow Accent Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cell Ring with Soft Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="url(#membraneGrad)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Subtle Microfluidic Stream Arc -->
  <path d="M 22 60 C 22 36, 36 20, 60 20 C 78 20, 94 32, 98 50" fill="none" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4,3" opacity="0.85"/>
  <path d="M 98 60 C 98 84, 84 100, 60 100 C 42 100, 26 88, 22 70" fill="none" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4,3" opacity="0.85"/>

  <!-- Micro-droplet dots -->
  <circle cx="22" cy="60" r="2.5" fill="#38bdf8"/>
  <circle cx="98" cy="60" r="2.5" fill="#38bdf8"/>
  <circle cx="60" cy="20" r="2.5" fill="#7dd3fc"/>
  <circle cx="60" cy="100" r="2.5" fill="#7dd3fc"/>

  <!-- Monogram PS (Stylized typography) -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle" dominant-baseline="central">
    <!-- Letter P -->
    <text x="47" y="58" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">P</text>
    <!-- Letter S -->
    <text x="73" y="63" fill="#38bdf8" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">S</text>
  </g>
</svg>
