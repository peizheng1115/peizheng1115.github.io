{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts: Plus Jakarta Sans for titles/headings & Inter for clean content -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Personal Site Icon / Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/logo.svg"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/logo.svg"/>
<meta name="theme-color" content="#0284c7"/>

<!-- end custom head snippets -->
